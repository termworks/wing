name: release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build distributions
        run: |
          nix develop --impure --command bash -c '
          micromamba env update --yes --prefix ./.micromamba --file environment.yml
          rm -rf dist
          micromamba run --prefix ./.micromamba python -m build --no-isolation --outdir dist'
      - name: Upload distributions
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
