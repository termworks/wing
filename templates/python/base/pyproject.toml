[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "{{kebab_name}}"
dynamic = ["version"]
description = "{{PROJECT_NAME}}"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

[project.scripts]
{{kebab_name}} = "{{snake_name}}.__main__:main"

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

# The version comes from PROJECT, the one file .make.lua reads, so what pip installs and what
# `make version` prints cannot drift apart. PROJECT is name on the first line, version on the
# second.
[tool.hatch.version]
path = "PROJECT"
pattern = "(?m)^(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"

[tool.hatch.build.targets.wheel]
packages = ["src/{{snake_name}}"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
