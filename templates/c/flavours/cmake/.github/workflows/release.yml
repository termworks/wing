name: release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build
        run: |
          nix develop --impure --command bash -c '
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel'
