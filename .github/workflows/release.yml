name: release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload artifacts for
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: release ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wing-linux-amd64
          - os: ubuntu-24.04-arm
            artifact: wing-linux-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.4"
      - name: Cache Nim
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimble
            ~/.cache/nim
          key: ${{ runner.os }}-${{ runner.arch }}-nim-${{ hashFiles('wing.nimble') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nim-
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          nimble install -y --depsOnly
      - name: Build release binary
        run: |
          nim c -d:release \
            --gcc.exe:musl-gcc --gcc.linkerexe:musl-gcc --passL:-static \
            --out:wing src/wing.nim
      # A binary that says "static" and comes out dynamic only fails for whoever downloads it,
      # so the tarball is not built until the ELF has been asked.
      - name: Verify the binary is static
        run: |
          file wing
          if readelf -l wing | grep -q 'program interpreter' || readelf -d wing | grep -q NEEDED; then
            echo "::error::wing is dynamically linked; the release must be static"
            exit 1
          fi
          ./wing --version
      - name: Package
        run: tar -czf "${{ matrix.artifact }}.tar.gz" wing
      - name: Upload artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
          files: ${{ matrix.artifact }}.tar.gz
          fail_on_unmatched_files: true
          overwrite_files: true
