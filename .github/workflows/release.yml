name: release

# Any `v*` tag publishes. `make release` cuts one and pushes it, so a release is one command and
# there is no release to open by hand first -- a tag pushed but never published is the failure this
# avoids, and it is the same trigger every generated project gets.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and upload artifacts for
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: release ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wing-linux-amd64
          - os: ubuntu-24.04-arm
            artifact: wing-linux-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      # Nim, musl and Lua all come from the flake, so the release binary is built from the same
      # pins the dev shell uses and there is no second version to keep in step.
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Install dependencies
        run: nix develop .#ci --command nimble install -y --depsOnly
      - name: Build release binary
        run: |
          nix develop .#ci --command bash -c '
            env WING_LUA="$LUA_MUSL" nim c -d:release \
              --gcc.exe:"$MUSL_DEV/bin/musl-gcc" \
              --gcc.linkerexe:"$MUSL_DEV/bin/musl-gcc" \
              --passL:-static --out:wing src/wing.nim'
      # A binary that says "static" and comes out dynamic only fails for whoever downloads it, so
      # the tarball is not built until the ELF has been asked. `ldd` is not enough on its own: it
      # prints "statically linked" for a binary that still carries an INTERP and will not start.
      - name: Verify the binary is static
        run: |
          nix develop .#ci --command bash -c '
            file wing
            if readelf -l wing | grep -q "program interpreter"; then
              echo "::error::wing requests a dynamic loader; it is not static"; exit 1
            fi
            if readelf -d wing | grep -q NEEDED; then
              echo "::error::wing has NEEDED entries; it is not static"; exit 1
            fi
            ./wing --version'
      - name: Package
        run: tar -czf "${{ matrix.artifact }}.tar.gz" wing
      # A tag is the trigger, so on the first run there is no release behind it yet: it is created
      # here rather than by hand, and reused on a re-run so a rebuilt asset replaces the old one.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ inputs.tag || github.ref_name }}'
          repo='${{ github.repository }}'
          sha256sum '${{ matrix.artifact }}.tar.gz' > '${{ matrix.artifact }}.sha256'
          gh release view "$tag" --repo "$repo" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$repo" --title "$tag" --generate-notes
          gh release upload "$tag" '${{ matrix.artifact }}.tar.gz' '${{ matrix.artifact }}.sha256' \
            --clobber --repo "$repo"
