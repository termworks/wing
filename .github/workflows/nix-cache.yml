name: nix-cache

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: nix-cache
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'termworks/wing' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    steps:
      - name: Check publishing credentials
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          PIN_TOKEN: ${{ secrets.PIN_TOKEN }}
        run: |
          if [ -z "$ATTIC_TOKEN" ] || [ -z "$PIN_TOKEN" ]; then
            echo "::error::Add the ATTIC_TOKEN and PIN_TOKEN Actions secrets for cache.bresilla.com."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
        with:
          extra_nix_config: |
            extra-substituters = https://cache.bresilla.com/bresilla
            extra-trusted-public-keys = bresilla:zsecaZYIrjCJQS4AuGPmEVU5PRkiMmB/Mds3KaCzTvE=
      - name: Build package and run install checks
        run: |
          nix build --accept-flake-config --no-update-lock-file --print-build-logs \
            --no-link --print-out-paths .#wing > "$RUNNER_TEMP/wing-store-paths"
      - name: Collect store paths and pins
        id: release
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          path=$(cat "$RUNNER_TEMP/wing-store-paths")
          echo "$path" > "$RUNNER_TEMP/push-paths"
          echo "wing-$SYSTEM $path" > "$RUNNER_TEMP/push-pins"
          { echo "paths<<EOF"; cat "$RUNNER_TEMP/push-paths"; echo EOF
            echo "pins<<EOF"; cat "$RUNNER_TEMP/push-pins"; echo EOF; } >> "$GITHUB_OUTPUT"
      # Only paths cache.nixos.org lacks; see bresilla/nixos .github/actions/attic-push.
      - uses: bresilla/nixos/.github/actions/attic-push@main
        with:
          paths: ${{ steps.release.outputs.paths }}
          pins: ${{ steps.release.outputs.pins }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          pin-token: ${{ secrets.PIN_TOKEN }}
          netbird-setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}

  verify-download:
    needs: publish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
        with:
          extra_nix_config: |
            extra-substituters = https://cache.bresilla.com/bresilla
            extra-trusted-public-keys = bresilla:zsecaZYIrjCJQS4AuGPmEVU5PRkiMmB/Mds3KaCzTvE=
      - name: Download package without local or remote builders
        run: |
          nix build --accept-flake-config --no-update-lock-file \
            --max-jobs 0 --builders '' .#wing
          binary=$(realpath result/bin/wing)
          export HOME="$RUNNER_TEMP/wing-home"
          export XDG_CONFIG_HOME="$HOME/config"
          export XDG_DATA_HOME="$HOME/data"
          mkdir -p "$HOME"
          cd "$HOME"
          "$binary" --version
          "$binary" --help
          "$binary" tui --snapshot | grep -F 'Projects:'
          "$binary" template builtins list --raw | grep -F nim
          "$binary" template apply nim "$HOME/generated" --name cache_smoke --no-git
          test -f "$HOME/generated/cache_smoke.nimble"
