name: tests

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.4"
      - name: Cache Nim
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimble
            ~/.cache/nim
          key: ${{ runner.os }}-nim-${{ hashFiles('wing.nimble') }}
          restore-keys: |
            ${{ runner.os }}-nim-
      - name: Install dependencies
        run: nimble install -y --depsOnly
      - name: Format check
        run: |
          for f in $(find src tests -name '*.nim' | sort); do
            cp "$f" "/tmp/fmt-$(basename "$f")"
            nimpretty "/tmp/fmt-$(basename "$f")"
            cmp -s "$f" "/tmp/fmt-$(basename "$f")" || { echo "nimpretty needed on: $f"; exit 1; }
          done
      - name: Check
        run: nim check src/wing.nim
      - name: Test
        run: nimble test -y
      - name: Build
        run: nim c -d:release --out:wing src/wing.nim
